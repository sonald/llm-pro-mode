[project]
name = "llm-pro-mode"
version = "0.2.0"
description = "Multi-interface LLM completion tool with parallel processing and result synthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anyio",
    "python-dotenv",
    "fastapi",
    "litellm",
    "pydantic",
    "rich",
    "textual",
    "uvicorn",
    "pyyaml",
]
authors = [
    { name = "LLM Pro Mode Team" }
]
keywords = ["llm", "ai", "cli", "tui", "api", "completion", "parallel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
llm-pro-mode = "llm_pro_mode.main:main"

[project.urls]
Homepage = "https://github.com/username/llm-pro-mode"
Repository = "https://github.com/username/llm-pro-mode.git"
