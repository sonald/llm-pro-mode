[package]
name = "llm-pro-mode-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri shell that wraps the LLM Pro Mode web interface"
authors = ["LLM Pro Mode Team"]

[lib]
name = "llm_pro_mode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.5", features = ["wry"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
